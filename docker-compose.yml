services:
  identity-db:
    image: postgres:15-alpine
    container_name: session13-identity-db

    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5441:5432"

    volumes:
      - identity_data:/var/lib/postgresql/data

volumes:
  identity_data: