server:
  port: 8888

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8080
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/products/**
              filters:
                - StripPrefix=1

jwt:
  secret: "12345678901234567890123456789012"